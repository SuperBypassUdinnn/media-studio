[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-studio"
version = "0.1.0"
description = "Headless media production toolkit for the OpenCode agent: video, audio, 3D, design, and free asset search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "fonttools>=4.47"]

[project.optional-dependencies]
# SAM 2 video background removal. Install with SAM2_BUILD_CUDA=0 to skip the
# custom CUDA kernel (non-fatal at runtime); models download on first use.
sam2 = ["sam2 @ git+https://github.com/facebookresearch/sam2.git"]

# Real rhythm analysis for ms video beats (beat/downbeat/energy detection).
rhythm = ["librosa>=0.11"]

# Optional colour tracing engine (vtracer); potrace stays the default fallback.
vector = ["vtracer>=0.6"]

# Playwright frame-stepped HTML/SVG-to-video rendering (reuses cached Chromium).
render-html = ["playwright>=1.50"]

# Free neural TTS (edge-tts) for ms audio tts.
tts = ["edge-tts>=7.0"]

# Pluggable free-quota generative layer: httpx client + Google AI Studio SDK.
gen = ["httpx>=0.28", "google-genai>=1.0"]

# Promo orchestrator: free-quota generation plus optional TTS/HTML rendering.
promo = ["httpx>=0.28", "google-genai>=1.0", "edge-tts>=7.0", "playwright>=1.50"]

[project.scripts]
ms = "media_studio.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/media_studio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `network` hit live provider APIs and are opt-in: `pytest -m network`.
addopts = "-q -m 'not network'"
markers = ["network: requires outbound network access to a live provider", "slow: real-ffmpeg end-to-end tests"]
