[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-studio"
version = "0.1.0"
description = "Headless media production toolkit for the OpenCode agent: video, audio, 3D, design, and free asset search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "fonttools>=4.47"]

[project.optional-dependencies]
resolve = ["mcp[cli]>=1.0"]

[project.scripts]
ms = "media_studio.cli:main"
resolve-mcp = "resolve_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_studio", "src/resolve_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `network` hit live provider APIs and are opt-in: `pytest -m network`.
addopts = "-q -m 'not network'"
markers = ["network: requires outbound network access to a live provider"]
