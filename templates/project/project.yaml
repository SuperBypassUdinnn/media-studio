slug: {{slug}}
title: {{title}}
status: draft

deliverables:
  - id: master-16x9
    kind: video
    resolution: 1920x1080
    fps: 60
    duration: 20.0
    loudness_lufs: -14.0
    container: mp4

timeline:
  - { start: 0.0, end: 2.7, shot: front-reveal, cue: ambient-drone }

brand:
  palette:
    primary: "#0B3D2E"
    accent: "#C8A24A"
    ink: "#101010"
  fonts:
    heading: Inter
    body: Inter

# Reserved for the preset registry (design decision D33): references by preset id
# with parameter overrides. The `ms` CLI ignores this section until that lands.
effects: []

# Assets referenced by id, as paths relative to the project root. The ledger writes
# the files and their sidecars; name the ones a deliverable uses here.
assets: {}

# How the video deliverable is assembled. Uncomment and point it at staged assets.
# video:
#   shots:
#     - { asset: shot-open, in: 0.5, duration: 2.7 }
#     - { asset: shot-detail, transition: crossfade }   # duration omitted means "the whole clip"
#   voice: { asset: vo-main }
#   music: { asset: music-bed, gain: 0.6, fade_in: 1.0, fade_out: 1.5, duck: true }
#   fade_in: 0.5
#   fade_out: 0.8
#   crossfade: 0.5                   # length of a shot whose transition is crossfade
#   titles:
#     - { text: "Opening title", start: 1.0, duration: 2.0, size: 64, position: "+0+120" }

budget:
  max_asset_bytes: 209715200
  max_project_bytes: 21474836480
  # true turns the CC0-first music preference into a hard rule.
  require_cc0_music: false
