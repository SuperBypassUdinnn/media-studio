<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metric Counter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent !important; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #root { width: 100%; height: 100%; position: relative; background: transparent !important; }
  .card {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(86vw, 640px);
    padding: 36px;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(var(--accent-rgb, 56, 189, 248), 0.3);
    border-radius: 20px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.16);
    backdrop-filter: blur(6px);
  }
  .label { font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent, #38bdf8); margin-bottom: 10px; }
  .counter { font-size: clamp(26px, 9vw, 72px); font-weight: 900; line-height: 1.05; color: var(--ink, #0f172a); }
  .unit { font-size: 0.55em; font-weight: 600; color: #64748b; }
  .sub { font-size: 15px; color: #475569; margin-top: 10px; }
  .track { width: 100%; height: 10px; background: #e2e8f0; border-radius: 6px; margin-top: 24px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent, #38bdf8); width: 0%; border-radius: 6px; transition: width 0.6s ease; }
  .spark { width: 100%; height: 70px; margin-top: 14px; }
  .spark polyline { fill: none; stroke: var(--accent, #38bdf8); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="root">
  <div class="card">
    <div class="label" id="label">Active users</div>
    <div class="counter" id="counter">0<span class="unit" id="unit"></span></div>
    <div class="sub" id="sub">Up from last period</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <svg class="spark" id="spark" viewBox="0 0 200 70" preserveAspectRatio="none"><polyline id="sparkLine" points="" /></svg>
  </div>
</div>
<script>
(function () {
  const root = document.getElementById('root');
  const counter = document.getElementById('counter');
  const unit = document.getElementById('unit');
  const label = document.getElementById('label');
  const sub = document.getElementById('sub');
  const fill = document.getElementById('fill');
  const sparkLine = document.getElementById('sparkLine');

  function applyParams(params) {
    if (!params) return;
    const p = (name, def) => (params[name] !== undefined && params[name] !== null) ? params[name] : def;
    if (p('label')) label.textContent = p('label');
    if (p('sub')) sub.textContent = p('sub');
    const prefix = p('prefix', '');
    const suffix = p('suffix', '');
    root.style.setProperty('--prefix', prefix);
    root.style.setProperty('--suffix', suffix);
    const accent = p('accent', '#38bdf8');
    const ink = p('ink', '#0f172a');
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--ink', ink);
    try {
      const c = accent.slice(1);
      root.style.setProperty('--accent-rgb', [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)].join(','));
    } catch (e) {}
    try {
      const c = ink.slice(1);
      root.style.setProperty('--ink-rgb', [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)].join(','));
    } catch (e) {}
    root.__targetValue = p('value', 0);
    root.__prefix = prefix;
    root.__suffix = suffix;
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // Deterministic sparkline from a seeded pseudo-random sequence.
  function sparkPoints(width, height, count) {
    let x = 0, y = height / 2, v = 0.5;
    const step = width / (count - 1);
    const pts = [x + ',' + y];
    for (let i = 1; i < count; i++) {
      v += (Math.sin(i * 0.9) * 0.25 + Math.cos(i * 1.3) * 0.15);
      v = Math.min(1, Math.max(0, v));
      x = i * step;
      y = height * (1 - v);
      pts.push(x + ',' + y);
    }
    return pts.join(' ');
  }

  window.__msSeek = function (timeSec, frameIndex, totalFrames, params) {
    applyParams(params);
    const progress = totalFrames > 1 ? frameIndex / (totalFrames - 1) : 0;
    const ease = easeOutCubic(progress);
    const value = Math.round((root.__targetValue || 0) * ease);
    counter.textContent = root.__prefix + value.toLocaleString() + root.__suffix;
    fill.style.width = Math.round(ease * 100) + '%';
    const w = 200, h = 70;
    sparkLine.setAttribute('points', sparkPoints(w, h, 14));
    // Animate sparkline dash offset so the line draws on over time.
    const len = sparkLine.getTotalLength ? sparkLine.getTotalLength() : 260;
    sparkLine.style.strokeDasharray = len + ' ' + len;
    sparkLine.style.strokeDashoffset = len * (1 - ease);
  };
})();
</script>
</body>
</html>
