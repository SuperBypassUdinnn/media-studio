license: CC0-1.0
source: bundled (synthesized in-house, media-studio)
sample_rate_hz: 48000
sample_width_bytes: 2
description: |
  World-class CC0 4-layer sound design and foley pack: atmospheric room drones,
  diegetic luxury product foley, speed-ramped transitions, and sub-bass trailer impacts.
effects:
  # --- Layer 1: Ambience & Drones ---
  - id: velvet-night-drone
    file: velvet-night-drone.wav
    tags: [ambience, drone, luxury, noir, warm]
    channels: 1
    duration_s: ~3.0
    description: Warm low drone with 55Hz fundamental and soft harmonics for luxury/noir atmospheres.
  - id: sub-room-ambience
    file: sub-room-ambience.wav
    tags: [ambience, room, rumble, low]
    channels: 1
    duration_s: ~2.5
    description: Subtle room acoustic presence with 42Hz foundation.
  - id: warm-analog-air
    file: warm-analog-air.wav
    tags: [ambience, air, analog, texture]
    channels: 1
    duration_s: ~2.0
    description: Filtered analog noise air floor.
  - id: ethereal-pad-swell
    file: ethereal-pad-swell.wav
    tags: [ambience, swell, pad, harmonic]
    channels: 1
    duration_s: ~3.0
    description: Lush harmonic pad swell in A major.

  # --- Layer 2: Diegetic Foley & Product ---
  - id: glass-crystal-resonance
    file: glass-crystal-resonance.wav
    tags: [foley, glass, crystal, resonance, luxury]
    channels: 1
    duration_s: ~1.2
    description: Pure 1.85kHz crystal flacon ring with long decay.
  - id: perfume-atomizer-mist
    file: perfume-atomizer-mist.wav
    tags: [foley, mist, spray, atomizer]
    channels: 1
    duration_s: ~0.7
    description: Crisp transient spray with air dispersion.
  - id: liquid-amber-swirl
    file: liquid-amber-swirl.wav
    tags: [foley, liquid, swirl, amber]
    channels: 1
    duration_s: ~1.0
    description: Fluid resonance of viscous liquid swirl.
  - id: water-droplet-obsidian
    file: water-droplet-obsidian.wav
    tags: [foley, droplet, water, obsidian]
    channels: 1
    duration_s: ~0.5
    description: Clean pitch-bent droplet impact.
  - id: magnetic-cap-click
    file: magnetic-cap-click.wav
    tags: [foley, click, cap, magnetic]
    channels: 1
    duration_s: ~0.3
    description: Sharp tactile double-click of luxury magnetic cap.
  - id: metallic-gleam-shimmer
    file: metallic-gleam-shimmer.wav
    tags: [foley, shimmer, gleam, metallic]
    channels: 1
    duration_s: ~1.5
    description: High chime shimmer for specular light sweeps.
  - id: silk-cloth-sweep
    file: silk-cloth-sweep.wav
    tags: [foley, cloth, silk, sweep]
    channels: 1
    duration_s: ~0.8
    description: Soft textured cloth rustle.

  # --- Layer 3: Cinematic Transitions & Risers ---
  - id: deep-cinema-whoosh
    file: deep-cinema-whoosh.wav
    tags: [transition, whoosh, cinema, low]
    channels: 1
    duration_s: ~1.2
    description: Deep cinematic camera move sweep.
  - id: whip-air-transient
    file: whip-air-transient.wav
    tags: [transition, whip, fast, transient]
    channels: 1
    duration_s: ~0.4
    description: Fast whip cut air transient.
  - id: reverse-vacuum-riser
    file: reverse-vacuum-riser.wav
    tags: [transition, riser, vacuum, reverse]
    channels: 1
    duration_s: ~1.5
    description: Exponential reverse vacuum suction riser.
  - id: orchestral-tension-riser
    file: orchestral-tension-riser.wav
    tags: [transition, riser, tension, orchestral]
    channels: 1
    duration_s: ~2.0
    description: Dissonant acoustic tension riser.
  - id: optical-flare-flash
    file: optical-flare-flash.wav
    tags: [transition, flash, flare, beam]
    channels: 1
    duration_s: ~0.8
    description: Bright resonant tone for light leak/flare hits.
  - id: whoosh-soft
    file: whoosh-soft.wav
    tags: [transition, whoosh, sweep, soft]
    channels: 2
    duration_s: ~0.9
    description: Soft filtered-noise whoosh sweep.
  - id: whoosh-fast
    file: whoosh-fast.wav
    tags: [transition, whoosh, sweep, fast]
    channels: 2
    duration_s: ~0.55
    description: Fast energetic whoosh sweep.
  - id: riser-build
    file: riser-build.wav
    tags: [transition, riser, build, sweep]
    channels: 1
    duration_s: ~1.6
    description: Exponential pitch riser.

  # --- Layer 4: Sub-Bass Drops & Impacts ---
  - id: sub-drop-40hz
    file: sub-drop-40hz.wav
    tags: [impact, sub, bass, drop]
    channels: 1
    duration_s: ~1.0
    description: Saturated 80Hz to 40Hz sub-bass pitch drop.
  - id: braam-low-horn
    file: braam-low-horn.wav
