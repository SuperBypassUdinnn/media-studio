  - id: crystalline-impact-hit
    file: crystalline-impact-hit.wav
    tags: [impact, crystalline, hit, glass]
    channels: 1
    duration_s: ~1.0
    description: High glass transient with resonant bass body.
  - id: impact-sub
    file: impact-sub.wav
    tags: [impact, sub, bass, punch]
    channels: 1
    duration_s: ~0.7
    description: Sub-bass impact punch with 48 Hz fundamental.
  - id: impact-hit
    file: impact-hit.wav
    tags: [impact, hit, transient, crisp]
    channels: 1
    duration_s: ~0.45
    description: Crisp transient hit with click.
  - id: ui-pop
    file: ui-pop.wav
    tags: [foley, ui, pop, click]
    channels: 1
    duration_s: ~0.18
    description: Short plucky UI pop.
