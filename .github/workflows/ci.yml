name: CI Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Lint, Test, & Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies (FFmpeg, Inkscape, Melt, Potrace, DejaVu Fonts, DBus)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg inkscape melt potrace fonts-dejavu-core dbus
          mkdir -p /tmp/opencode
      - name: Install Python Linters & Test tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-xdist
          pip install -e ".[gen,tts]"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run Quality Verification Pipeline
        # dbus-run-session gives GLib-based tools (Inkscape) a private session bus headlessly.
        run: dbus-run-session -- python3 scripts/verify_pipeline.py
      - name: Verify Planning & Backlog Parity
        run: python3 scripts/sync_backlog_status.py --check
