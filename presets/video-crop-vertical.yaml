id: video-crop-vertical
title: Vertical crop
kind: video-effect
engine: mlt
intent: [crop, vertical, social, reels, tiktok, shorts, reframe]
applies_to: [video]
summary: Crops the sides off a 16:9 frame to reach 9:16, for social deliverables.
implementation:
  mlt_filter: crop
  properties:
    left: "{left}"
    right: "{right}"
    top: "{top}"
    bottom: "{bottom}"
parameters:
  - name: left
    type: integer
    default: 656
    minimum: 0
    maximum: 4000
    unit: px
    description: Pixels removed from the left edge.
  - name: right
    type: integer
    default: 656
    minimum: 0
    maximum: 4000
    unit: px
    description: Pixels removed from the right edge.
  - name: top
    type: integer
    default: 0
    minimum: 0
    maximum: 4000
    unit: px
    description: Pixels removed from the top edge.
  - name: bottom
    type: integer
    default: 0
    minimum: 0
    maximum: 4000
    unit: px
    description: Pixels removed from the bottom edge.
license: CC0-1.0
provenance: in-house, verified against a measured frame; defaults turn 1920x1080 into 608x1080
